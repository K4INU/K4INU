  <text x="160" y="177" text-anchor="middle" fill="#b9abff" font-family="ui-monospace, monospace" font-size="20" font-weight="900" letter-spacing="1">OBSIDIAN</text>
  <text x="160" y="300" text-anchor="middle" fill="#668d80" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">BLUE TEAM VILLAGE CTF</text>
